<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrungePlunge Online — Smells Like Chain Spirit</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Oswald:wght@400;700&display=swap');
    :root {
      --grunge-black: #0d0b09;
      --grunge-brown: #2a231b;
      --grunge-rust: #6b4423;
      --grunge-mud: #4a3f35;
      --grunge-cream: #c9b896;
      --grunge-dust: #8b7355;
      --grunge-blood: #8b2513;
      --grunge-neon: #7cfc00;
      --grunge-crack: #3d3529;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Special Elite', monospace;
      background: var(--grunge-black);
      color: var(--grunge-cream);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse at 20% 80%, var(--grunge-rust) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, var(--grunge-mud) 0%, transparent 40%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0L60 30L30 60L0 30z' fill='%232a231b' fill-opacity='0.15'/%3E%3C/svg%3E");
    }
    .noise::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }
    header {
      border-bottom: 3px solid var(--grunge-rust);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      background: linear-gradient(180deg, var(--grunge-brown) 0%, var(--grunge-black) 100%);
    }
    header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.2em;
      color: var(--grunge-neon);
      text-shadow: 0 0 20px rgba(124, 252, 0, 0.3);
    }
    .wallet-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .wallet-row input {
      width: 420px;
      max-width: 100%;
      padding: 0.5rem 0.75rem;
      background: var(--grunge-crack);
      border: 1px solid var(--grunge-rust);
      color: var(--grunge-cream);
      font-family: inherit;
      font-size: 0.9rem;
    }
    .wallet-row input::placeholder { color: var(--grunge-dust); }
    .btn {
      font-family: 'Oswald', sans-serif;
      padding: 0.5rem 1.25rem;
      background: var(--grunge-rust);
      border: 2px solid var(--grunge-dust);
      color: var(--grunge-cream);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: background 0.2s, color 0.2s;
    }
    .btn:hover {
      background: var(--grunge-blood);
      color: #fff;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--grunge-blood); border-color: var(--grunge-rust); }
    .btn-primary:hover { background: #a52a2a; }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--grunge-mud);
    }
    .tabs button {
      font-family: 'Oswald', sans-serif;
      padding: 0.75rem 1.5rem;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--grunge-dust);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }
    .tabs button:hover { color: var(--grunge-cream); }
